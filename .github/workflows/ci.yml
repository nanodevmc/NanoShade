name: CI & Distribution

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-rust-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: nanoshade
            asset_name: nanoshade-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: nanoshade
            asset_name: nanoshade-linux-arm64
          - os: ubuntu-latest
            target: aarch64-linux-android
            binary_name: nanoshade
            asset_name: nanoshade-android-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: nanoshade.exe
            asset_name: nanoshade-windows-x86_64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: nanoshade.exe
            asset_name: nanoshade-windows-arm64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: nanoshade
            asset_name: nanoshade-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Cross-Compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Setup Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android24-clang
        run: |
          if [ "${{ matrix.target }}" == "aarch64-linux-android" ]; then
            export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
            cargo build --release --manifest-path nanoshade-core/Cargo.toml --target ${{ matrix.target }}
          else
            cargo build --release --manifest-path nanoshade-core/Cargo.toml --target ${{ matrix.target }}
          fi

      - name: Run Core Tests
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'aarch64-apple-darwin'
        run: cargo test --manifest-path nanoshade-core/Cargo.toml --target ${{ matrix.target }}

      - name: Prepare Binary Artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp nanoshade-core/target/${{ matrix.target }}/release/${{ matrix.binary_name }} artifacts/${{ matrix.asset_name }}
          if [ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ] || [ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]; then
            cp nanoshade-core/target/${{ matrix.target }}/release/${{ matrix.binary_name }} artifacts/${{ matrix.binary_name }}
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: artifacts/*

  integration-tests:
    name: CLI Integration Tests (${{ matrix.os }})
    needs: build-rust-binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Linux Binary
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: dist

      - name: Download Windows Binary
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-pc-windows-msvc
          path: dist

      - name: Test Native CLI Execution
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            chmod +x dist/nanoshade.exe || true
            ./dist/nanoshade.exe --help
          else
            chmod +x dist/nanoshade
            ./dist/nanoshade --help
          fi

  test-nanomarket-build:
    name: Real-world Test (Build NanoMarket with NanoShade)
    needs: build-rust-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: bin-linux

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-pc-windows-msvc
          path: bin-win

      - name: Embed Binaries and Install Maven Plugin locally
        run: |
          mkdir -p nanoshade-maven-plugin/src/main/resources/binaries/linux-x86_64
          mkdir -p nanoshade-maven-plugin/src/main/resources/binaries/windows-x86_64
          cp bin-linux/nanoshade nanoshade-maven-plugin/src/main/resources/binaries/linux-x86_64/nanoshade
          cp bin-win/nanoshade.exe nanoshade-maven-plugin/src/main/resources/binaries/windows-x86_64/nanoshade.exe
          chmod +x nanoshade-maven-plugin/src/main/resources/binaries/linux-x86_64/nanoshade
          cd nanoshade-maven-plugin
          mvn clean install -DskipTests

      - name: Clone NanoMarket
        run: |
          git clone --depth 1 https://github.com/NanoDev1488/NanoMarket.git test-nanomarket

      - name: Inject NanoShade into NanoMarket pom.xml
        run: |
          python3 .github/scripts/inject_plugin.py

      - name: Build NanoMarket with NanoShade
        run: |
          cd test-nanomarket
          mvn clean package -DskipTests

      - name: Verify NanoMarket Shaded Artifact
        run: |
          ls -la test-nanomarket/target/
          if [ -f test-nanomarket/target/NanoMarket-2.0.0.jar ]; then
            echo "SUCCESS: NanoMarket-2.0.0.jar successfully built with NanoShade!"
          else
            echo "ERROR: Shaded artifact not found!"
            exit 1
          fi

  publish-and-release:
    name: Publish Maven Plugin & Create Multi-Arch Release
    needs: [ build-rust-binaries, integration-tests, test-nanomarket-build ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Maven settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.m2
          cat << 'EOF' > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Download All Binaries
        uses: actions/download-artifact@v4
        with:
          path: all-binaries

      - name: Embed Binaries into Maven Plugin Resources
        run: |
          mkdir -p nanoshade-maven-plugin/src/main/resources/binaries/linux-x86_64
          mkdir -p nanoshade-maven-plugin/src/main/resources/binaries/windows-x86_64
          cp all-binaries/binary-x86_64-unknown-linux-gnu/nanoshade nanoshade-maven-plugin/src/main/resources/binaries/linux-x86_64/nanoshade || true
          cp all-binaries/binary-x86_64-pc-windows-msvc/nanoshade.exe nanoshade-maven-plugin/src/main/resources/binaries/windows-x86_64/nanoshade.exe || true
          chmod +x nanoshade-maven-plugin/src/main/resources/binaries/linux-x86_64/nanoshade || true

      - name: Build Maven Plugin with Embedded Binaries
        run: |
          cd nanoshade-maven-plugin
          mvn clean package -DskipTests

      - name: Deploy to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          cd nanoshade-maven-plugin
          mvn deploy -DskipTests \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} || echo "GitHub package already published or up to date"

      - name: Prepare Release Assets Directory
        run: |
          mkdir -p release-dist
          find all-binaries/ -type f -exec cp {} release-dist/ \;
          cp nanoshade-maven-plugin/target/nanoshade-maven-plugin-*.jar release-dist/
          ls -la release-dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
